<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="CellDot">
  <title>CellDot</title>
  <!-- the cell: one organic boundary, tangent-continuous at every anchor -->
  <path d="M32 11 C44 11 53 19 53 31 C53 43 45 55 32 55 C20 55 11 46 11 34 C11 22 20 11 32 11 Z"
        fill="none" stroke="#17697F" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- molecules the cell already holds -->
  <circle cx="24"   cy="28"   r="2.6" fill="#17697F"/>
  <circle cx="33.5" cy="21.5" r="2.6" fill="#17697F"/>
  <circle cx="26.5" cy="42"   r="2.6" fill="#17697F"/>
  <circle cx="38.5" cy="45"   r="2.6" fill="#17697F"/>
  <!-- one molecule being reassigned in, on its path -->
  <path d="M55.5 13.5 C51 17 47 22 43 28"
        fill="none" stroke="#D9A441" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M43 28 l4.5 -2.2 M43 28 l0.3 -5.0"
        fill="none" stroke="#D9A441" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="58.5" cy="10" r="3.2" fill="#D9A441"/>
</svg>
